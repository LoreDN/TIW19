<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Project Management and Reporting</title>
    <link rel="stylesheet" href="/TIW19-javascript/css/global.css"/>
    <link rel="stylesheet" href="/TIW19-javascript/css/authentication.css"/>
</head>
<body>

    <!-- SECTION 1 ----- Login -->
    <div id="section-login" class="auth-wrapper">
        <div class="auth-card">
            <h1>"Project Management and Reporting" Web Portal</h1>
            <p>Sign in to continue</p>

            <!-- print Login Errors -->
            <p id="login-error" class="msg-error" style="display:none;"></p>

            <!-- Login form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="login-username" required />
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="login-password" required />
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- SECTION 2 ----- Choose Technical Role -->
    <div id="section-chooseRole" class="auth-wrapper" style="display:none;">
        <div class="auth-card">
            <h1>"Project Management and Reporting" Web Portal</h1>
            <p id="chooseRole-welcome"></p>
            <h2>Choose your Technical Role</h2>

            <p>
                <a id="button-chooseRole-Manager" class="role-button">Go to Home Manager</a><br/>
                <a id="button-chooseRole-Collaborator" class="role-button">Go to Home Collaborator</a><br/>
                <a id="button-chooseRole-Logout" class="role-button logout">LOGOUT</a>
            </p>
        </div>
    </div>

    <!-- load scripts -->
    <script src="/TIW19-javascript/js/utils.js"></script>
    <script src="/TIW19-javascript/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Project Management and Reporting</title>
</head>
<body>
    <h1>Access to the "Project Management and Reporting" Web Portal</h1>

    <p th:text="'Welcome, ' + ${session.user.name} + ' ' + ${session.user.surname}"></p>
    <h2>Choose your Technical Role</h2>
    <p>You have both Manager and Collaborator roles. Which home page do you want to access?</p>

    <p>
        <a th:href="@{/homeManager}">Go to Home Manager</a> |
        <a th:href="@{/homeCollaborator}">Go to Home Collaborator</a> |
        <a th:href="@{/logout}">LOGOUT</a>
    </p>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page - Manager role</title>
    <link rel="stylesheet" th:href="@{/css/global.css}"/>
    <link rel="stylesheet" th:href="@{/css/home.css}"/>
</head>
<body>
    <div class="page-wrapper">
        <h1>Home Page - Manager role</h1>
        <div class="welcome-section">
            <div class="welcome-bar">
                <p th:text="'Welcome, ' + ${session.user.getName()} + ' ' + ${session.user.getSurname()}"></p>
                <img th:src="@{'/images/' + ${session.user.getPhoto()}}" alt="Profile photo"/>
            </div>
            <p class="nav-bar">
                Go to <a th:href="@{/homeManager/projectMonitoring}">Project Monitoring</a> |
                <a th:href="@{/homeManager/collaboratorsMonitoring}">Collaborators Monitoring</a> |
                <a th:href="@{/logout}">LOGOUT</a>
            </p>
        </div>

        <!-- Task-Hours Assignment form -->
        <h2>Assign the amount of hours planned for one couple (Task, Month)</h2>
        <p th:if="${hoursErrorMessage}" th:text="${hoursErrorMessage}" class="msg-error"></p>
        <p th:if="${hoursSuccessMessage}" th:text="${hoursSuccessMessage}" class="msg-success"></p>
        <form th:action="@{/homeManager/hoursAssignment}" method="post" class="home-form">
            <!-- Task reference -->
            <div class="form-group">
                <label for="HoursTask">Reference Task title:</label>
                <select id="HoursTask" name="taskTitles" required>
                    <option th:each="t : ${tasks}"
                            th:value="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle()}"
                            th:text="${t.getProject().getAdmin() + ' | ' + t.getProject().getTitle() + ' - ' + t.getWorkPackage().getTitle() + ' - ' + t.getTitle() + ' | M' + t.getStartingMonth() + ' -> M' + t.getEndingMonth()}"
                            th:selected="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle() == hoursTaskTitles}">
                    </option>
                </select>
            </div>

            <!-- Assignment parameters -->
            <div class="form-group">
                <label for="HoursMonth">Month:</label>
                <input type="number" id="HoursMonth" name="month" th:value="${plannedMonth}" min="1" required/>
            </div>

            <div class="form-group">
                <label for="Hours">Planned Hours:</label>
                <input type="number" id="Hours" name="hours" th:value="${plannedHours}" min="0" required/>
            </div>

            <button type="submit">Save Planned Hours</button>
        </form>

        <!-- Collaborators Assignment form -->
        <h2>Assign a Collaborator to a Task</h2>
        <p th:if="${collaboratorErrorMessage}" th:text="${collaboratorErrorMessage}" class="msg-error"></p>
        <p th:if="${collaboratorSuccessMessage}" th:text="${collaboratorSuccessMessage}" class="msg-success"></p>
        <form th:action="@{/homeManager/collaboratorAssignment}" method="post" class="home-form">
            <!-- Task reference -->
            <div class="form-group">
                <label for="TaskCollaborators">Reference Task title:</label>
                <select id="TaskCollaborators" name="taskTitles" required>
                    <option th:each="t : ${tasks}"
                            th:value="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle()}"
                            th:text="${t.getProject().getAdmin() + ' | ' + t.getProject().getTitle() + ' - ' + t.getWorkPackage().getTitle() + ' - ' + t.getTitle() + ' | M' + t.getStartingMonth() + ' -> M' + t.getEndingMonth()}"
                            th:selected="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle() == collaboratorTaskTitles}">
                    </option>
                </select>
            </div>

            <!-- Assignment parameters -->
            <div class="form-group">
                <label for="Collaborator">Collaborator:</label>
                <input type="text" id="Collaborator" name="collaborator" th:value="${collaborator}" required/>
            </div>

            <div class="form-group">
                <label for="Month">Month:</label>
                <input type="number" id="Month" name="month" th:value="${collaboratorMonth}" min="1" required/>
            </div>

            <button type="submit">Save Assignment</button>
        </form>

        <!-- Project Assignment form -->
        <h2>Set a Project to the status ASSIGNED</h2>
        <p th:if="${assignmentErrorMessage}" th:text="${assignmentErrorMessage}" class="msg-error"></p>
        <p th:if="${assignmentSuccessMessage}" th:text="${assignmentSuccessMessage}" class="msg-success"></p>
        <form th:action="@{/homeManager/projectAssignment}" method="post" class="home-form">
            <!-- Project selection -->
            <div class="form-group">
                <label for="Project">Project title:</label>
                <select id="Project" name="projectTitle" required>
                    <option th:each="p : ${toAssignProjects}"
                            th:value="${p.getTitle()}"
                            th:text="${p.getTitle()}"
                            th:selected="${p.getTitle() == projectTitle}">
                    </option>
                </select>
            </div>

            <button type="submit">Set Project to ASSIGN status</button>
        </form>
    </div>
</body>
</html>

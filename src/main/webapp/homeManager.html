<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page - Manager role</title>
</head>
<body>
    <h1>Home Page - Manager role</h1>
    <p th:text="'Welcome, ' + ${session.user.name} + ' ' + ${session.user.surname}"></p>
    <p>Go to <a th:href="@{/homeManager/projectMonitoring}">Project Monitoring</a> | <a th:href="@{/homeManager/collaboratorsMonitoring}">Collaborators Monitoring</a> | <a th:href="@{/logout}">LOGOUT</a></p>

    <!-- Task-Hours Assignment form -->
    <h2>Assign the amount of hours planned for one couple (Task, Month)</h2>
    <p th:if="${hoursErrorMessage}" th:text="${hoursErrorMessage}" style="color:red;"></p>
    <p th:if="${hoursSuccessMessage}" th:text="${hoursSuccessMessage}" style="color:green;"></p>
    <form th:action="@{/homeManager/hoursAssignment}" method="post">
        <!-- Task reference -->
        <label for="HoursTask">Reference Task title:</label>
        <select id="HoursTask" name="taskTitles" required>
            <option th:each="t : ${tasks}"
                    th:value="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle()}"
                    th:text="${t.getProject().getAdmin() + ' | ' + t.getProject().getTitle() + ' - ' + t.getWorkPackage().getTitle() + ' - ' + t.getTitle() + ' | M' + t.getStartingMonth() + ' -> M' + t.getEndingMonth()}"
                    th:selected="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle() == hoursTaskTitles}">
            </option>
        </select><br/>

        <!-- Assignment parameters -->
        <label for="HoursMonth">Month:</label>
        <input type="number" id="HoursMonth" name="month" th:value="${plannedMonth}" min="1" required/><br/>

        <label for="Hours">Planned Hours:</label>
        <input type="number" id="Hours" name="hours" th:value="${plannedHours}" min="0" required/><br/>

        <button type="submit">Save Planned Hours</button>
    </form>

    <!-- Collaborators Assignment form -->
    <h2>Assign a Collaborator to a Task</h2>
    <p th:if="${collaboratorErrorMessage}" th:text="${collaboratorErrorMessage}" style="color:red;"></p>
    <p th:if="${collaboratorSuccessMessage}" th:text="${collaboratorSuccessMessage}" style="color:green;"></p>
    <form th:action="@{/homeManager/collaboratorAssignment}" method="post">
        <!-- Task reference -->
        <label for="TaskCollaborators">Reference Task title:</label>
        <select id="TaskCollaborators" name="taskTitles" required>
            <option th:each="t : ${tasks}"
                    th:value="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle()}"
                    th:text="${t.getProject().getAdmin() + ' | ' + t.getProject().getTitle() + ' - ' + t.getWorkPackage().getTitle() + ' - ' + t.getTitle() + ' | M' + t.getStartingMonth() + ' -> M' + t.getEndingMonth()}"
                    th:selected="${t.getProject().getAdmin() + '###' + t.getProject().getTitle() + '###' + t.getWorkPackage().getTitle() + '###' + t.getTitle() == collaboratorTaskTitles}">
            </option>
        </select><br/>

        <!-- Assignment parameters -->
        <label for="Collaborator">Collaborator:</label>
        <input type="text" id="Collaborator" name="collaborator" th:value="${collaborator}" required/><br/>

        <label for="Month">Month:</label>
        <input type="number" id="Month" name="month" th:value="${collaboratorMonth}" min="1" required/><br/>

        <button type="submit">Save Assignment</button>
    </form>

    <!-- Project Assignment form -->
    <h2>Set a Project to the status ASSIGNED</h2>
    <p th:if="${assignmentErrorMessage}" th:text="${assignmentErrorMessage}" style="color:red;"></p>
    <p th:if="${assignmentSuccessMessage}" th:text="${assignmentSuccessMessage}" style="color:green;"></p>
    <form th:action="@{/homeManager/projectAssignment}" method="post">
        <!-- Project selection -->
        <label for="Project">Project title:</label>
        <select id="Project" name="projectTitle" required>
            <option th:each="p : ${toAssignProjects}"
                    th:value="${p.getTitle()}"
                    th:text="${p.getTitle()}"
                    th:selected="${p.getTitle() == projectTitle}">
            </option>
        </select><br/>

        <button type="submit">Set Project to ASSIGN status</button>
    </form>
</body>
</html>

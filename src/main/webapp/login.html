<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Project Management and Reporting</title>
    <link rel="stylesheet" th:href="@{/css/global.css}"/>
    <link rel="stylesheet" th:href="@{/css/authentication.css}"/>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>"Project Management and Reporting" Web Portal</h1>
            <p>Sign in to continue</p>

            <!-- print Login Errors -->
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>

            <!-- Login form -->
            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" th:value="${username}" required />
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required /><br/>
                </div>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>

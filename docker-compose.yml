version: "3.8"
services:

  # mariaDB container
  mariadb:

    # set the container
    image: mariadb:latest
    container_name: db-TIW19

    # set the environment
    env_file: .env
    ports:
      - "3306:3306"

    # set volumes
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:Z
      - ./db/data:/var/lib/mysql:Z